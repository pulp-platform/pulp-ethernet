package:
  name: ethernet_idma

  authors:
    - "Chaoqun Liang <chaoqun.liang@unibo.it>" 
    - "Alessandro Ottaviano <aottaviano@iis.ee.ethz.ch>"
   
dependencies:
  axi :                 { git: "git@github.com:pulp-platform/axi.git",                      version: 0.39.1 }
  common_verification : { git: "https://github.com/pulp-platform/common_verification.git",  version: 0.2.0  }
  register_interface :  { git: "https://github.com/pulp-platform/register_interface.git",   version: 0.4.2  }
  common_cells:         { git: "https://github.com/pulp-platform/common_cells.git",         version: 1.21.0 }
  axi_stream:           { git: "git@github.com:pulp-platform/axi_stream.git",               rev: "54891ff"  }
  idma:                 { git: "git@github.com:pulp-platform/iDMA.git",                     version: 0.6.0  } 
  

export_include_dirs:
  - include

sources:
  # Source files grouped in levels. Files in level 0 have no dependencies on files in this
  # package. Files in level 1 only depend on files in level 0, files in level 2 on files in
  # levels 1 and 0, etc. Files within a level are ordered alphabetically.
  # Level 0
  - gen/eth_idma_reg_pkg.sv
  - gen/eth_idma_reg_top.sv
  - rtl/clk_gen_hyper.sv
  - rtl/axis_gmii_rx.sv
  - rtl/axis_gmii_tx.sv
   # Level 1
  - rtl/eth_mac_1g_rgmii_fifo.sv
  - rtl/eth_mac_1g_rgmii.sv
  - rtl/eth_mac_1g.sv
  - rtl/iddr.sv
  - rtl/oddr.sv
  - rtl/rgmii_core.sv
  - rtl/rgmii_lfsr.sv
  - rtl/rgmii_phy_if.sv
  - rtl/rgmii_soc.sv
  - rtl/ssio_ddr_in.sv
   # Level 2
  - rtl/framing_top.sv
  - rtl/eth_top.sv
  - rtl/eth_idma_wrap.sv
  - rtl/eth_idma_wrap_syth.sv

  - target: test
    files:
      - target/sim/src/eth_idma_tb.sv



